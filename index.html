<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebGPU Atmosphere & 250k Particle Sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; color: #fff; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: fixed; top: 16px; left: 16px;
      background: rgba(10, 14, 24, 0.72); backdrop-filter: blur(8px);
      padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column; gap: 10px; width: 280px;
    }
    label { display: flex; justify-content: space-between; font-size: 12px; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .hint { font-size: 11px; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="gfx"></canvas>
  <div id="ui">
    <div>
      <label><span>Sun Elevation</span><span id="sunVal">0.28</span></label>
      <input id="sun" type="range" min="-0.15" max="1.2" step="0.01" value="0.28" />
    </div>
    <div>
      <label><span>Cloud Coverage</span><span id="cloudVal">0.52</span></label>
      <input id="cloud" type="range" min="0.2" max="0.85" step="0.01" value="0.52" />
    </div>
    <div>
      <label><span>Curl Turbulence</span><span id="curlVal">1.40</span></label>
      <input id="curl" type="range" min="0.1" max="3.5" step="0.05" value="1.40" />
    </div>
    <div class="hint">Drag / Hover mouse on canvas to inject a 3D vortex wind brush into 250,000 GPU particles.</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
